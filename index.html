    <!-- Build-time environment island. Vite replaces %VITE_*% tokens; when
         a variable is unset the token remains and is treated as "missing".
         Canonical/preconnect hints read this so we never pin a stale or
         deleted project/service after infrastructure is recreated. -->
    <script>
      window.__NEXUSEDU_ENV__ = {
        SITE_URL: "%VITE_SITE_URL%",
        SUPABASE_URL: "%VITE_SUPABASE_URL%",
        API_BASE_URL: "%VITE_API_BASE_URL%"
      };
    </script>
    <script>
      (function () {
        var env = (window.__NEXUSEDU_ENV__ || {});
        function valid(v) { return v && v.indexOf('%') !== 0; }
        function setHint(rel, href) {
          if (!valid(href)) return;
          var l = document.createElement('link');
          l.rel = rel; l.href = href;
          if (rel === 'preconnect') l.crossOrigin = 'anonymous';
          document.head.appendChild(l);
        }
        setHint('canonical', env.SITE_URL);
        setHint('preconnect', env.SUPABASE_URL);
        if (valid(env.API_BASE_URL)) {
          var d = document.createElement('link');
          d.rel = 'dns-prefetch'; d.href = env.API_BASE_URL;
          document.head.appendChild(d);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/nexusedu-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e50914">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
