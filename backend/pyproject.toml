[tool.poetry]
name = "nexusedu-backend"
version = "0.1.0"
description = "NexusEdu Backend"
authors = ["NexusEdu"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.115.5"
uvicorn = "0.32.1"
python-multipart = "0.0.9"
httpx = "0.27.2"
pyrogram = "2.0.106"
tgcrypto = "1.2.5"
redis = "5.0.3"
pydantic-settings = "2.2.1"
python-jose = {extras = ["cryptography"], version = "3.3.0"}
passlib = {extras = ["bcrypt"], version = "1.7.4"}

[tool.poetry.group.dev.dependencies]
pytest = "8.1.1"
pytest-asyncio = "0.23.6"
bandit = "1.7.8"

[tool.pytest.ini_options]
# Stage 4 CI fix: CI runs plain `pytest backend/tests` from the repo root.
# The bare pytest entry point does not add the cwd to sys.path (unlike
# `python -m pytest`), so `import backend.main` failed (exit code 4).
# rootdir resolves to backend/, therefore ".." is the repository root.
pythonpath = [".."]
asyncio_mode = "strict"
